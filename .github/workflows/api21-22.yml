name: API 21 and 22 contracts
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [21, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build exact instrumentation APK
        run: |
          set -euo pipefail
          mkdir -p verification/api
          bash gradlew -Pmeguviz.profile=android --no-daemon :android:assembleDebugAndroidTest 2>&1 | tee verification/api/build.log
          sha256sum android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk > verification/api/apk.sha256
          find core/src/main android/src/main android/src/androidTest -type f -print0 | sort -z | xargs -0 sha256sum > verification/api/sources.sha256
          git rev-parse HEAD > verification/api/head.txt
      - name: Enable KVM for this hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run device contracts
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "${{ matrix.api }}"
            test -z "$(adb shell pm list packages io.github.jichuo1.meguviz.drawable.contracttest | tr -d '\r')"
            adb install android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk | tee verification/api/install.log
            adb shell am instrument -w -r io.github.jichuo1.meguviz.drawable.contracttest/io.github.jichuo1.meguviz.drawable.android.test.ContractInstrumentation | tee verification/api/result.log
            tr -d '\r' < verification/api/result.log | grep -qx 'CONTRACT PASS checks=52'
            grep -q 'INSTRUMENTATION_CODE: -1' verification/api/result.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: api-${{ matrix.api }}-contracts-${{ github.sha }}
          path: verification/api/
          if-no-files-found: warn
          retention-days: 7

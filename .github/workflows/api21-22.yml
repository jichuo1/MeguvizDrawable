name: API 21 and 22 contracts
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [21, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build exact instrumentation APK
        run: |
          set -euo pipefail
          mkdir -p verification/api
          bash gradlew -Pmeguviz.profile=android --no-daemon :android:assembleDebugAndroidTest :core:publishCandidatePublicationToStagingRepository :android:publishCandidatePublicationToStagingRepository 2>&1 | tee verification/api/build.log
          bash gradlew -p fixtures/provider --init-script "$GITHUB_WORKSPACE/tools/verify-provider-debug.init.gradle" --no-daemon :provider:check :app:verifyCandidateResolution :app:verifyDebugCandidateResolution :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee verification/api/provider-build.log
          bash gradlew -p fixtures/provider --no-daemon :app:dependencies --configuration debugRuntimeClasspath 2>&1 | tee verification/api/provider-debug-dependencies.log
          cp android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk verification/api/core-test.apk
          cp fixtures/provider/app/build/outputs/apk/debug/app-debug.apk verification/api/provider-app.apk
          cp fixtures/provider/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk verification/api/provider-test.apk
          sha256sum verification/api/core-test.apk verification/api/provider-app.apk verification/api/provider-test.apk > verification/api/apks.sha256
          find build/staging-maven/io/github/jichuo1/meguviz -type f \( -name '*.jar' -o -name '*.aar' -o -name '*.pom' -o -name '*.module' \) -print0 | sort -z | xargs -0 sha256sum > verification/api/staging.sha256
          find core/src/main android/src/main android/src/androidTest fixtures/provider/provider/src fixtures/provider/app/src -type f -print0 | sort -z | xargs -0 sha256sum > verification/api/sources.sha256
          git rev-parse HEAD > verification/api/head.txt
      - name: Enable KVM for this hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run device contracts
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/run-api-contracts.sh ${{ matrix.api }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: api-${{ matrix.api }}-contracts-${{ github.sha }}
          path: verification/api/
          if-no-files-found: warn
          retention-days: 7

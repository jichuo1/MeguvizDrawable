import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import java.security.MessageDigest

// Applied only to the independent provider build. The app may use its own
// :provider project; the Meguviz libraries must resolve to staged artifacts.
gradle.beforeProject { project ->
    if (project.path == ':app') {
        project.tasks.register('verifyDebugCandidateResolution') {
            doLast {
                def artifacts = project.configurations.getByName('debugRuntimeClasspath')
                        .resolvedConfiguration.resolvedArtifacts
                def modules = [] as Set
                int providers = 0
                artifacts.each { artifact ->
                    def id = artifact.id.componentIdentifier
                    if (id instanceof ProjectComponentIdentifier) {
                        if (id.projectPath != ':provider') {
                            throw new GradleException("Unexpected project substitution: ${id}")
                        }
                        providers++
                    } else if (id instanceof ModuleComponentIdentifier) {
                        def staged = project.rootProject.file("../../build/staging-maven/${id.group.replace('.', '/')}/${id.module}/${id.version}/${artifact.file.name}")
                        if (!staged.isFile() || !Arrays.equals(staged.bytes, artifact.file.bytes)) {
                            throw new GradleException("Debug artifact differs from staged candidate: ${id}")
                        }
                        def hash = MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes)
                                .collect { String.format('%02x', it & 0xff) }.join('')
                        println "debug candidate ${id.group}:${id.module}:${id.version} ${artifact.file.name} sha256=${hash}"
                        modules.add("${id.group}:${id.module}:${id.version}" as String)
                    } else {
                        throw new GradleException("Unsupported dependency source: ${id}")
                    }
                }
                def expected = [
                        'io.github.jichuo1.meguviz:meguviz-drawable-core:0.1.0-dev.3',
                        'io.github.jichuo1.meguviz:meguviz-drawable-android:0.1.0-dev.3'
                ] as Set
                if (providers != 1 || modules != expected || artifacts.size() != 3) {
                    throw new GradleException("Unexpected debug dependency graph: ${modules}, providers=${providers}")
                }
            }
        }
    }
}
